[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "grouping-trainer"
dynamic = ["version"]
description = "Trainer for Sentry AI grouping"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "accelerate==1.12.0",
    "datasets==4.4.1",
    "optimum==1.27.0",
    "polars==1.32.0",  # cudf lol
    "pydantic==2.11.9",
    "sentence-transformers==5.1.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.56.2",
    "typed-argument-parser==1.11.0",
    "wandb==0.23.1",
]
requires-python = ">=3.12"
authors = [
    { name = "Kush Dubey", email = "kushdubey63@gmail.com" },
]
maintainers = [
    { name = "Kush Dubey", email = "kushdubey63@gmail.com" },
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "seaborn>=0.13.2",
]
sheets = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "grouping_trainer.__version__"}

[tool.ruff]
include = ["*.py"]
line-length = 120
indent-width = 4
extend-include = ["*.ipynb"]

[project.urls]
Homepage = "https://github.com/getsentry/grouping-trainer"
Issues = "https://github.com/getsentry/grouping-trainer/issues"
